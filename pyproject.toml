[project]
name = "invoice-csv-studio"
version = "1.0.0"
description = "Extract invoice tables from PDFs and export them as CSV"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "gunicorn>=23.0.0",
    "numpy>=2.2.5",
    "opencv-python>=4.11.0.86",
    "pandas>=2.2.3",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.6",
    "pytesseract>=0.3.13",
    "werkzeug>=3.1.3",
]
